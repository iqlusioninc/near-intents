[package]
name = "defuse-crypto"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# Enforce the fixed P-256 arithmetic floor even for consumers with an older lockfile.
crypto-bigint = { version = "0.7.6", default-features = false }
ed25519-dalek.workspace = true
hex.workspace = true
near-sdk = { workspace = true, features = ["unstable"] }
p256.workspace = true
strum.workspace = true
thiserror.workspace = true

arbitrary = { workspace = true, features = ["derive"], optional = true }
near-api-types = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }

[features]
abi = ["serde", "serde_with/schemars_0_8"]
arbitrary = ["dep:arbitrary"]
near-api-types = ["dep:near-api-types"]
serde = ["dep:serde_with"]

[lints]
workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unstable", "unit-testing"] }
rstest.workspace = true
